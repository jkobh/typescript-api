services:
  db:
    image: docker.io/library/postgres:18
    container_name: coffee_db
    environment:
      POSTGRES_USER: coffee
      POSTGRES_PASSWORD: coffee
      POSTGRES_DB: coffee_machine
    ports:
      - '5432:5432'
    volumes:
      - coffee_db_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U coffee -d coffee_machine']
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    container_name: coffee_keycloak
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - '8080:8080'
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro,z

volumes:
  coffee_db_data:
